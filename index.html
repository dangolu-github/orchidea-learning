<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchidea English Practice</title>
  <style>
    :root{--ink:#193248;--muted:#65798a;--navy:#173f5f;--blue:#2e78a6;--teal:#2b7a78;--paper:#fff;--line:#d6e1e7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(150deg,#e8f1f5,#f8fafb);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    main{width:min(780px,calc(100% - 24px));padding:42px;border-radius:18px;background:var(--paper);box-shadow:0 20px 60px rgba(23,63,95,.14)}.eyebrow{color:var(--blue);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:.4rem 0 .7rem;color:var(--navy);font-size:clamp(2rem,6vw,3.4rem);line-height:1.04}p{color:var(--muted)}
    .routes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}.route{display:block;padding:20px;border:1px solid var(--line);border-radius:13px;color:var(--ink);text-decoration:none;transition:.15s}.route:hover,.route:focus{transform:translateY(-2px);border-color:var(--blue);outline:none;box-shadow:0 9px 24px rgba(46,120,166,.12)}.route b{display:block;color:var(--navy);font-size:1.08rem}.route span{display:block;margin-top:5px;color:var(--muted);font-size:.9rem}
    @media(max-width:620px){main{padding:28px 21px}.routes{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Orchidea Prep Course</div>
  <h1>English Practice</h1>
  <p>Choose a practice set. Your written answers stay only in your browser unless you send them privately to your teacher.</p>
  <div class="routes">
    <a class="route" href="hm-0807/"><b>Reading &amp; Listening · 7 August</b><span>Two Reading and two Listening sets</span></a>
    <a class="route" href="hm-0813/"><b>B1 Reading &amp; Listening · 13 August</b><span>Four full exam-style tasks</span></a>
  </div>
</main>
</body>
</html>
